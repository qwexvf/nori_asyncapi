asyncapi: 3.0.0
info:
  title: Match Platform Realtime
  version: 0.1.0
  description: Queue, match and lobby realtime channels.
defaultContentType: application/json
servers:
  realtime:
    host: rt.example.com
    protocol: ws
    description: WebSocket gateway.
channels:
  serverCounts:
    address: server.counts
    description: Live player counts per game server.
    messages:
      countUpdate:
        $ref: '#/components/messages/CountUpdate'
  lobbyChat:
    address: lobby/{lobbyId}/chat
    parameters:
      lobbyId:
        description: The lobby id.
    messages:
      chatMessage:
        $ref: '#/components/messages/ChatMessage'
operations:
  onServerCounts:
    action: send
    channel:
      $ref: '#/channels/serverCounts'
    messages:
      - $ref: '#/channels/serverCounts/messages/countUpdate'
  sendChat:
    action: receive
    channel:
      $ref: '#/channels/lobbyChat'
    messages:
      - $ref: '#/channels/lobbyChat/messages/chatMessage'
components:
  messages:
    CountUpdate:
      name: CountUpdate
      contentType: application/json
      payload:
        type: object
        required:
          - serverId
          - players
        properties:
          serverId:
            type: string
          players:
            type: integer
          map:
            type: string
          ping:
            type: integer
    ChatMessage:
      name: ChatMessage
      payload:
        type: object
        required:
          - user
          - text
        properties:
          user:
            type: string
          text:
            type: string
          ts:
            type: integer
